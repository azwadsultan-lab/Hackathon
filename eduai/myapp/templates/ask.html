
{% extends 'base.html' %}

{% block content %}
<div class="min-h-[calc(100vh-80px)] w-full bg-[#f8f9fa] flex flex-col pt-8 pb-36 px-4 sm:px-6 font-sans">
    
    <div class="w-full max-w-4xl mx-auto flex flex-col h-full flex-grow">
        
        <div class="mb-8 text-center mt-4">
            <span class="inline-block bg-[#fde047] text-black text-[10px] font-bold uppercase tracking-widest px-4 py-2 rounded-full border-2 border-black shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] mb-6">
                Ask EduAi
            </span>
            <h2 class="text-4xl md:text-5xl font-extrabold text-black tracking-tight">
                What's on your 
                <span class="relative inline-block z-10 px-1">
                    mind?
                    <span class="absolute bottom-2 left-0 w-full h-3 bg-[#fbc9c3] -z-10 rounded-sm transform rotate-1"></span>
                </span>
            </h2>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-auto">
            
            <button class="text-left bg-white border-2 border-black rounded-2xl p-5 hover:-translate-y-1 hover:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transition-all duration-200 group relative overflow-hidden flex items-center cursor-pointer">
                <div class="absolute top-0 left-0 w-3 h-full bg-[#cdd0f8] border-r-2 border-black group-hover:w-4 transition-all"></div>
                <div class="pl-4">
                    <div class="flex items-center justify-between mb-2">
                        <span class="bg-[#f8f9fa] border border-black rounded-full p-1.5 text-xl">📈</span>
                        <span class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Economics</span>
                    </div>
                    <h3 class="font-bold text-black text-lg leading-tight mb-1">Supply & Demand</h3>
                    <p class="text-xs text-gray-600 font-medium">Explain market elasticity mechanics.</p>
                </div>
            </button>

            <button class="text-left bg-white border-2 border-black rounded-2xl p-5 hover:-translate-y-1 hover:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transition-all duration-200 group relative overflow-hidden flex items-center cursor-pointer">
                <div class="absolute top-0 left-0 w-3 h-full bg-[#fbc9c3] border-r-2 border-black group-hover:w-4 transition-all"></div>
                <div class="pl-4">
                    <div class="flex items-center justify-between mb-2">
                        <span class="bg-[#f8f9fa] border border-black rounded-full p-1.5 text-xl">💻</span>
                        <span class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Comp Sci</span>
                    </div>
                    <h3 class="font-bold text-black text-lg leading-tight mb-1">Syntax Errors</h3>
                    <p class="text-xs text-gray-600 font-medium">How to troubleshoot C pointers.</p>
                </div>
            </button>

            <button class="text-left bg-white border-2 border-black rounded-2xl p-5 hover:-translate-y-1 hover:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transition-all duration-200 group relative overflow-hidden flex items-center cursor-pointer">
                <div class="absolute top-0 left-0 w-3 h-full bg-[#fde68a] border-r-2 border-black group-hover:w-4 transition-all"></div>
                <div class="pl-4">
                    <div class="flex items-center justify-between mb-2">
                        <span class="bg-[#f8f9fa] border border-black rounded-full p-1.5 text-xl">🔭</span>
                        <span class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Physics</span>
                    </div>
                    <h3 class="font-bold text-black text-lg leading-tight mb-1">Focal Lengths</h3>
                    <p class="text-xs text-gray-600 font-medium">Magnification in optical telescopes.</p>
                </div>
            </button>

            <button class="text-left bg-white border-2 border-black rounded-2xl p-5 hover:-translate-y-1 hover:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transition-all duration-200 group relative overflow-hidden flex items-center cursor-pointer">
                <div class="absolute top-0 left-0 w-3 h-full bg-[#7bcbc3] border-r-2 border-black group-hover:w-4 transition-all"></div>
                <div class="pl-4">
                    <div class="flex items-center justify-between mb-2">
                        <span class="bg-[#f8f9fa] border border-black rounded-full p-1.5 text-xl">⚖️</span>
                        <span class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Reasoning</span>
                    </div>
                    <h3 class="font-bold text-black text-lg leading-tight mb-1">Logical Flaws</h3>
                    <p class="text-xs text-gray-600 font-medium">Identify gaps in formal arguments.</p>
                </div>
            </button>

        </div>

        <div class="mt-8 relative z-40">
            <div class="flex items-center bg-white border-2 border-black rounded-full shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] p-2 focus-within:-translate-y-1 focus-within:shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] transition-all duration-200">
                
                <div class="pl-4 text-black">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                
                <input type="text" placeholder="Type a concept to verify..." class="w-full bg-transparent border-none focus:outline-none focus:ring-0 px-4 py-3 text-black font-bold placeholder-gray-400 text-lg">
                
                <a href="/subject/" class="bg-[#7bcbc3] border-2 border-black rounded-full w-12 h-12 flex-shrink-0 flex items-center justify-center hover:bg-[#5aa8a0] active:translate-y-1 active:shadow-none shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] transition-all cursor-pointer">
                    <svg class="w-5 h-5 text-black transform rotate-90 translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </a>
            </div>
            
            <p class="text-center text-[10px] font-bold uppercase tracking-wider text-gray-500 mt-6 flex items-center justify-center gap-1.5">
                <span class="w-2 h-2 bg-green-400 rounded-full border border-black inline-block"></span>
                Cross-referenced with UQ Library databases
            </p>
        </div>

    </div>
</div>
{% endblock %}
