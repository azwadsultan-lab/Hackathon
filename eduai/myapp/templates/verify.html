{% extends 'base.html' %}

{% block content %}
<div class="min-h-[calc(100vh-80px)] w-full bg-[#f8f9fa] flex flex-col pt-8 pb-36 px-4 sm:px-6 font-sans">
    
    <div class="w-full max-w-4xl mx-auto flex flex-col h-full flex-grow">
        
        <div class="mb-6 text-center mt-4">
            <span class="inline-block bg-[#fbc9c3] text-black text-[10px] font-bold uppercase tracking-widest px-4 py-2 rounded-full border-2 border-black shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] mb-4">
                The BS Detector
            </span>
            <h2 class="text-4xl md:text-5xl font-extrabold text-black tracking-tight">
                Verify any 
                <span class="relative inline-block z-10 px-1">
                    claim.
                    <span class="absolute bottom-2 left-0 w-full h-3 bg-[#7bcbc3] -z-10 rounded-sm transform -rotate-1"></span>
                </span>
            </h2>
            <p class="text-gray-600 font-medium mt-4 text-sm max-w-lg mx-auto">Paste an excerpt from an essay, a news article, or an AI-generated response. EduAi will scan it for logical fallacies and unverified facts.</p>
        </div>

        <div class="bg-white border-2 border-black rounded-[2rem] p-4 sm:p-6 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] mt-4 relative group focus-within:-translate-y-1 focus-within:shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] transition-all duration-200">
            
            <div class="absolute top-4 right-4 flex gap-2">
                <div class="w-3 h-3 rounded-full border-2 border-black bg-[#fbc9c3]"></div>
                <div class="w-3 h-3 rounded-full border-2 border-black bg-[#fde047]"></div>
                <div class="w-3 h-3 rounded-full border-2 border-black bg-[#7bcbc3]"></div>
            </div>

            <label class="font-bold text-black uppercase tracking-widest text-[10px] mb-3 block">Text to Analyze</label>
            
            <textarea rows="8" placeholder="Paste your text here..." class="w-full bg-[#f8f9fa] border-2 border-black rounded-xl p-4 text-black font-medium focus:outline-none focus:bg-white transition-colors resize-none placeholder-gray-400"></textarea>
            
            <div class="flex flex-col sm:flex-row justify-between items-center mt-4 pt-4 border-t-2 border-black border-dashed gap-4">
                <p class="text-[10px] font-bold uppercase tracking-wider text-gray-500 flex items-center gap-1.5">
                    <span class="w-2 h-2 bg-purple-400 rounded-full border border-black inline-block"></span>
                    Powered by UQ Academic Databases
                </p>
                
                <button class="w-full sm:w-auto bg-[#cdd0f8] border-2 border-black rounded-xl px-8 py-3 font-black text-black uppercase tracking-widest shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] hover:-translate-y-1 hover:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:translate-y-0 active:shadow-none transition-all flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    Run Scan
                </button>
            </div>
        </div>

    </div>
</div>
{% endblock %}
