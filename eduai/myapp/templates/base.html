<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackathon App</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

 <nav class="w-full bg-[#f8f9fa] pt-6 pb-2 z-50">
    <div class="max-w-5xl mx-auto flex justify-between items-center px-4 sm:px-6">
        
        <a href="/" class="group flex items-center gap-3 cursor-pointer transition-transform hover:-translate-y-1">
            <div class="w-10 h-10 bg-[#fde047] border-2 border-black shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] rounded-xl flex items-center justify-center font-black text-xl text-black">
                E
            </div>
            <h1 class="font-extrabold text-2xl text-black tracking-tight group-hover:underline decoration-4 decoration-[#7bcbc3] underline-offset-4">
                EduAi
            </h1>
        </a>

        <div class="flex items-center gap-4">
            
            <button class="relative p-2 bg-white border-2 border-black rounded-full shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] hover:-translate-y-1 hover:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:translate-y-0 active:shadow-none transition-all cursor-pointer">
                <svg class="w-5 h-5 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                <span class="absolute -top-1 -right-1 w-3.5 h-3.5 bg-[#fbc9c3] border-2 border-black rounded-full"></span>
            </button>
            
            <button class="w-10 h-10 bg-[#cdd0f8] border-2 border-black rounded-full shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] hover:-translate-y-1 hover:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:translate-y-0 active:shadow-none transition-all cursor-pointer flex items-center justify-center">
                <span class="font-black text-black text-sm">AS</span>
            </button>

        </div>
    </div>
</nav>

    <main class="flex-grow w-full">
        {% block content %}
        {% endblock %}
    </main>

<nav class="fixed bottom-6 left-1/2 transform -translate-x-1/2 w-[90%] max-w-sm bg-[#7bcbc3] border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] rounded-full z-50 px-6 py-3 transition-all">
    <div class="flex justify-between items-center">
        
        <a href="/" class="group flex items-center justify-center cursor-pointer">
            <div class="p-2.5 rounded-full bg-[#fde047] border-2 border-black shadow-sm group-hover:-translate-y-1 transition-transform">
                <svg class="w-6 h-6 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            </div>
        </a>

        <a href="/ask/" class="group flex items-center justify-center cursor-pointer">
            <div class="p-2.5 rounded-full border-2 border-transparent group-hover:bg-white group-hover:border-black group-hover:shadow-sm group-hover:-translate-y-1 transition-all">
                <svg class="w-6 h-6 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"></path></svg>
            </div>
        </a>

        <a href="#" class="group flex items-center justify-center cursor-pointer">
            <div class="p-2.5 rounded-full border-2 border-transparent group-hover:bg-white group-hover:border-black group-hover:shadow-sm group-hover:-translate-y-1 transition-all">
                <svg class="w-6 h-6 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </div>
        </a>

    </div>
</nav>

</body>
</html>
