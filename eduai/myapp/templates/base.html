<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackathon App</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <nav class="bg-white border-b p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="font-bold text-xl text-blue-600">EduAi</h1>
            <div class="w-8 h-8 bg-gray-200 rounded-full"></div> </div>
    </nav>

    <main class="flex-grow max-w-4xl mx-auto w-full p-4">
        {% block content %}
        {% endblock %}
    </main>

    <nav class="bg-white border-t p-3 sticky bottom-0">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <button class="text-blue-600 flex flex-col items-center">
                <span class="text-xs">Home</span>
            </button>
            <button class="text-gray-400 flex flex-col items-center">
                <span class="text-xs">Search</span>
            </button>
            <button class="text-gray-400 flex flex-col items-center">
                <span class="text-xs">Settings</span>
            </button>
        </div>
    </nav>

</body>
</html>
